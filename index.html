<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070321">
<title>CSwithSR Board</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div id="app">
  <header>
    <img alt="CSwithSR" src="icons/logo.png">
    <button id="backCode" class="backcode" hidden>‹ Back to code</button>
    <div class="chips" id="chips"></div>
  </header>
  <nav class="rail" id="railL" aria-label="Class and ink"></nav>
  <section id="win" aria-label="Lesson board">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
      <div id="title"></div><span id="pg">1 / 1</span></div>
<div id="panes">
    <div id="board"><canvas id="ink"></canvas>
      <div id="hint">Write with your <b>S Pen</b><br>One finger scrolls · two fingers zoom<br>Hold the pen button to erase</div></div>
    <div id="ide" hidden></div>
    <div id="divider" aria-label="Drag to resize the windows"></div>
    <div id="pane2" hidden>
      <div class="p2bar"><select id="p2sheet" aria-label="Sheet in this window"></select><button id="p2ren" class="ib sm" aria-label="Rename sheet">✎</button><button id="p2new" class="ib sm">+ Sheet</button><button id="p2del" class="ib sm" aria-label="Delete this sheet">🗑</button><span id="p2pg"></span><button id="p2close" class="ib sm" aria-label="Close second window">✕</button></div>
      <div id="board2"><canvas id="ink2"></canvas></div>
    </div>
    </div>
  </section>
  <nav class="rail" id="railR" aria-label="Tools"></nav>
  <footer>@cswithsr</footer>
</div>

<div id="cam" hidden><video playsinline muted autoplay></video><span class="grip" aria-label="Resize camera"></span></div>

<section id="lib" aria-label="Lesson library">
  <div class="libwrap">
    <div class="libtop">
      <img alt="CSwithSR" src="icons/logo.png">
      <div class="libtitle"><h1>Lesson Library</h1><p id="libsub">Pick a topic to open its notes</p></div>
      <div class="libactions">
        <input id="search" type="search" placeholder="Search topics" aria-label="Search topics">
        <button id="editBtn" class="ghost">Edit</button>
        <button id="trashBtn" class="ghost">Trash</button>
        <button id="quick" class="ghost">Quick board</button>
        <button id="recsBtn" class="ghost">Recordings</button>
        <button id="driveBtn" class="ghost">My Drive</button>
        <button id="upsBtn" class="ghost">Drive uploads</button>
      </div>
    </div>
    <div id="cont"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="libbody"></div>
  </div>
</section>

<button id="show" aria-label="Show tools"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
<input type="file" id="file" accept="application/pdf,image/*" hidden>
<div id="toast" role="status"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
